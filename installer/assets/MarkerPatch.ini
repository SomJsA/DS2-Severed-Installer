[DLC]
; Hazard 套装包：在商店开放 Hazard 套装包中的装备。
EnableHazardPack = 0

; Martial Law 套装包：在商店开放 Martial Law 套装包中的装备。
EnableMartialLawPack = 0

; Supernova 套装包：在商店开放 Supernova 套装包中的装备。
EnableSupernovaPack = 0

; Severed 巡逻装备：开放 Severed 巡逻服与配套步枪。此项只控制装备，剧情关卡由 DLC 安装项提供。
EnableSeveredDLC = 0

; 黑客服装与武器：开放黑客服装和配套武器，部分装备仍受游戏进度限制。
EnableHackerDLC = 0

; 狂热者服装与武器：在商店开放 Zealot 狂热者套装及配套武器。
EnableZealotDLC = 0

; 铆钉枪：在商店开放额外的铆钉枪武器。
EnableRivetGunDLC = 0

; Ignition 奖励房间：解锁原本供 Dead Space Ignition 玩家进入的奖励房间。
EnableIgnitionRooms = 0

; 初代等离子切割器：开放原本由初代存档解锁的奖励等离子切割器。
EnableOriginalPlasmaCutter = 0

[Graphics]
; 各向异性过滤：改善斜视角纹理清晰度；0 表示关闭。
MaxAnisotropy = 16

; 动态阴影分辨率：只在游戏阴影设为“非常高”时使用；高于 1920 才启用覆盖。
DynamicShadowResolution = 1920

; 增强抗锯齿：FXAA、SMAA 需要游戏内抗锯齿开启；SSAA 更清晰，但性能开销较大。
ImprovedAntiAliasingMode = 2

; SSAA 分辨率倍率：仅使用 SSAA 时生效，倍率越高，显卡负担越重。
SSAAScale = 2.0

[Display]
; 自动匹配屏幕分辨率：首次启动时自动使用屏幕分辨率。关闭后保留游戏自身的分辨率设置。
AutoResolution = 1

; 字幕缩放：启用适配高分辨率的字幕缩放，并应用所设倍率。默认倍率为 1.0倍；关闭此项时倍率不生效。
FontScaling = 1

; 字幕倍率：默认 1.0，需要 FontScaling 开启。
FontScalingFactor = 1.0

; 视野倍率：以默认视野为基准，1.0 为原始视野。
FOVScale = 1.0

[Input]
; 原始鼠标输入：使鼠标灵敏度不再随帧率变化。陀螺仪瞄准要求此项开启。
RawMouseInput = 1

; SDL 手柄输入：用 SDL 接管 XInput 手柄处理。会改变手柄输入路径，现有手柄正常时可保持关闭。
UseSDLControllerInput = 1

; 屏蔽 DirectInput 设备：除鼠标键盘外，屏蔽 DirectInput 设备；不会屏蔽 XInput 手柄。使用其他控制器时需留意兼容性。
BlockDirectInputDevices = 1

; 允许系统快捷键：阻止游戏拦截 Windows 等系统按键，方便使用系统快捷键。
DisableKeyboardHook = 1

; 额外鼠标键绑定：允许将鼠标第 4 至第 8 键绑定到原本仅接受键盘输入的动作。
ExtraMouseButtonBinding = 1

; 自动隐藏菜单鼠标：使用手柄时隐藏菜单鼠标指针，重新移动鼠标后再显示。
AutoHideMouseCursor = 1

; 陀螺仪瞄准：启用兼容手柄的体感瞄准，需要原始鼠标输入。漂移时可将手柄放稳数秒校准。
GyroEnabled = 0

; 陀螺仪灵敏度：体感瞄准灵敏度倍率，需要先开启陀螺仪瞄准。
GyroSensitivity = 1.0

; 陀螺仪平滑：数值越高越平滑，但响应也会变慢。
GyroSmoothing = 0.016

; 保存陀螺仪校准：为具有唯一序列号的手柄保存校准记录，并在重新连接后恢复。
GyroCalibrationPersistence = 1

; 触摸板模拟鼠标：用兼容手柄的触摸板模拟鼠标移动。
TouchpadEnabled = 1

; 任天堂手柄按键交换：交换 A/B、X/Y 的对应关系，适配任天堂手柄布局。
InvertABXYButtons = 1

[Fixes]
; 高帧率物理修复：以 30 FPS 物理步长并插值显示尸体、断肢与物品，减轻高帧率下乱飞的问题。
HavokPhysicsFix = 1

; 多核心处理器启动修复：针对超过 10 个核心的处理器相关崩溃。无此问题时可保持关闭。
HighCoreCPUFix = 1

; 解除线程核心限制：允许 Windows 将主线程和渲染线程分配到不同核心，不再都固定于第一个核心。
ThreadAffinityFix = 1

; 垂直同步刷新率修复：让垂直同步使用所选刷新率，避免锁定在 30 FPS。
VSyncRefreshRateFix = 1

; 帧率限制节奏修复：改善垂直同步限帧的帧间隔，并减少限帧等待时持续占用处理器。
FixFrameLimiter = 1

; 难度通关奖励修复：修正存档的难度通关记录，使 Hardcore 与 Zealot 奖励正常解锁。
FixDifficultyRewards = 1

; 服装编号冲突修复：修正装备编号冲突，减轻购买特定服装后其他服装消失的问题。
FixSuitIDConflicts = 1

; Hazard 服装图标修复：修正商店中 Hazard 工程服错误显示精英高级服头盔的问题。
FixHazardSuitIcon = 1

; 存档字符串处理修复：修正存档字符串处理中的缓冲区越界。对游戏版本的函数匹配有要求，默认关闭。
FixSaveStringHandling = 1

; 自动武器射速修复：减轻自动武器在不同帧率下射速不一致的问题。
FixAutomaticWeaponFireRate = 1

; 第七章电梯门修复：修正高于 30 FPS 时重载检查点导致太阳能阵列电梯门卡住的问题。
FixSolarArrayElevator = 1

; 高分辨率模糊效果修复：修正高于 720p 时景深、泛光、发光与热浪效果的模糊强度。
FixBlurResolution = 1

; 柔和阴影模糊修复：修正高于 720p 时柔和阴影的模糊强度。
FixShadowBlur = 1

; 顶点法线与着色修复：修正部分着色器误读法线所导致的玻璃反射、手电、粒子照明与动态模糊异常。
FixVertexNormals = 1

; 耀斑方块修复 / D3D9：修复 NVIDIA 显卡开启耀斑时出现的块状光影异常。该修复使用 Direct3D9 挂钩路径。
FixFlareArtifacts = 1

; 头发与布料物理修复：减轻高于 30 FPS 时头发与布料变轻、漂浮的现象。
FixClothPhysics = 1

; 高帧率菜单速度修复：减轻高帧率下菜单滚动、菜单镜头跟随鼠标过快的问题。
FixMenuSpeed = 1

; 游戏时钟修复：减轻不限帧时游戏时间快于真实时间，以及帧间隔不稳定的问题。
FixGameClock = 1

; 主循环空转优化：让主线程等待音频时休眠，减少持续空转占用处理器。
FixMainLoopSpin = 1

; 高帧率场景流送优化：按真实帧时间处理下一地区的数据，减轻高帧率时的流送卡顿。
FixStreamingBudget = 1

; 音频载入卡顿修复：缩短区域音频加载时产生的停顿。
FixAudioSyncStall = 1

; 场景纹理预上传：在场景流送期间上传新纹理，减轻首次显示新纹理时的卡顿。
PreloadStreamedTextures = 1

; 移动转向停顿修复：减轻高帧率下边移动边转向时角色短暂停顿的问题。
FixInputHistory = 1

; 钉墙弹体修复：修正高帧率下钉刺弹体力度不足、敌人未能钉在墙上的表现。
FixImpalingProjectiles = 1

; 持续爆炸伤害修复：让持续爆炸按预期频率计算伤害与推力，避免高帧率时每帧重复命中。
FixExplosionDamage = 1

; 视野外特效时长修复：修正高帧率下身后火焰、蒸汽、火花与爆炸过早停止的问题。
FixOffscreenEffects = 1

; 换装动画时序修复：修正载入更快时换装柜门过早打开，与灯光扫过不同步的问题。
FixSuitChangeTiming = 1

[General]
; 游戏内成就提示：显示成就进度、解锁提示和成就列表。默认使用 HOME 键打开列表。
AchievementSupport = 1

; 成就列表快捷键：Windows 虚拟键码；默认 36 为 HOME。
AchievementOverlayKey = 36

; 关闭失效在线连接：阻止连接已经失效的在线服务，并隐藏相关断线提示。
DisableOnlineFeatures = 1

; 增加尸体与断肢保留：让当前区域保留更多尸体与断肢；数量可在参数页调整，可能增加资源占用。
IncreasedEntityPersistence = 1

; 尸体保留数量：需要先开启“增加尸体与断肢保留”。数量较大时可能增加资源占用。
IncreasedEntityPersistenceBodies = 25

; 断肢保留数量：需要先开启“增加尸体与断肢保留”。
IncreasedEntityPersistenceLimbs = 96

; 增加贴花细节：允许保留更详细的贴花效果，可能增加资源占用。
IncreasedDecalPersistence = 1

; 跳过开场视频：启动游戏时跳过开场视频。
SkipIntro = 0

; 取消最短加载等待：数据实际加载完成后立即结束加载画面，不再等待人为设定的最短时长。
SkipArtificialLoadingDelay = 1

; 加载 ASI 插件：加载游戏 plugins 文件夹内的 ASI 插件。安装 Severed DLC 时此项是必需依赖；已有 Ultimate ASI Loader 时由其负责加载。
LoadASIPlugins = 1

; 提示扩展游戏可用内存：需要时提示应用 LAA 补丁，让 32 位游戏可使用更大内存。确认后会修改游戏 EXE；此开关使用询问模式，默认关闭。
CheckLAAPatch = 0

[Modding]
; 导出已加载资源：将游戏载入的资源写入 archive_dump，主要用于研究和模组开发，可能产生大量文件。
DumpArchiveAssets = 0

; 加载散装模组文件：从 mods 子目录载入替换资源，目录结构需与资源导出结构一致。
LoadModFiles = 1

; 散装模组读取线程：0 使用主线程，1–16 使用后台线程；只影响散装模组。
LooseFileThreads = 4

; 散装模组预读内存（MB）：读取线程大于 0 时可提前读取散装模组；0 关闭预读。
LooseFilePrefetchMB = 32

; 跳过已替换归档数据：配合散装模组使用，跳过只包含已替换资源的归档区段；首次载入会建立资源映射记录。
SkipReplacedArchiveData = 1

; 游戏归档预读（MB）：0 关闭此项；游戏原始值为 1；补丁支持最高 64 MB。
StreamReadAheadMB = 8

